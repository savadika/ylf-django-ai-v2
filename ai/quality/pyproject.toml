[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness-only rules. Expand this set as the legacy codebase is cleaned up.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
  "business/UniDjango/user",
  "business/UniDjango/role",
  "business/UniDjango/menu",
  "business/UniDjango/department",
  "business/UniDjango/log",
  "business/UniDjango/cockpit",
  "business/UniDjango/utils",
]
omit = [
  "*/migrations/*",
  "*/tests.py",
  "*/apps.py",
  "*/admin.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 35
