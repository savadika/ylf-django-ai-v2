name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --openssl-legacy-provider
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            business/UniDjango/requirements.txt
            business/UniDjango/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: business/frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r business/UniDjango/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: business/frontend
        run: npm ci
      - name: Run full quality gate
        run: python ai/quality/quality.py full --backend-runtime local --frontend-runtime local
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            ai/reports
            ai/cockpit/index.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: business/UniDjango/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: business/frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r business/UniDjango/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: business/frontend
        run: npm ci
      - name: Run release quality gate
        run: python ai/quality/quality.py release --backend-runtime local --frontend-runtime local
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-evidence
          path: |
            ai/reports
            ai/cockpit/index.html
